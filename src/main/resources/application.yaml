server:
  port: 8000

spring:
  application:
    name: ventas
  datasource:
    url: jdbc:postgresql://localhost:5432/ventas_db
    username: ventas_user
    password: 22161062
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # Evita que Spring Boot vuelva a ejecutar data.sql en cada arranque
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    user:
      name: admin
      password: admin123_cambiame
      roles: ACTUATOR_ADMIN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
